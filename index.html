<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0f172a"/>
<meta name="description" content="Science-based nutrition, training and family meal planning that adapts to every person in your home."/>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<title>Fueld</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f172a;--panel:#1e293b;--line:#334155;--mut:#94a3b8;--acc:#f97316}
body{background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.header{background:linear-gradient(135deg,#1e293b,#0f172a);padding:max(16px,env(safe-area-inset-top)) 16px 12px}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.header-title{font-size:1.2rem;font-weight:800;letter-spacing:.01em}
.header-sub{font-size:.68rem;color:var(--mut);margin-top:2px}
.header-protein-num{font-size:1.5rem;font-weight:800;color:var(--acc);text-align:right}
.header-protein-label{font-size:.66rem;color:var(--mut);text-align:right}
.prof-sel{margin-top:8px;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:9999px;padding:5px 10px;font-size:.78rem;max-width:210px}
.bars{margin-top:10px}
.bar-row{margin-bottom:8px}
.bar-meta{display:flex;justify-content:space-between;font-size:.7rem;margin-bottom:3px;gap:8px}
.bar-meta span:first-child{font-weight:600}
.bar-meta span:last-child{color:var(--mut)}
.bar-track{width:100%;background:var(--line);border-radius:9999px;overflow:hidden}
.bar-fill{height:8px;border-radius:9999px;transition:width .4s}
.bar-cal .bar-fill{height:10px}
.tabs{display:flex;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:5}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{flex:1;padding:11px 10px;font-size:.7rem;font-weight:600;background:none;border:none;border-bottom:2px solid transparent;color:var(--mut);cursor:pointer;white-space:nowrap}
.tab-btn.active{color:var(--acc);border-bottom-color:var(--acc)}
#view{padding:16px 16px calc(40px + env(safe-area-inset-bottom));flex:1}
.card{background:var(--panel);border-radius:12px;padding:14px;margin-bottom:12px}
.card-dark{background:var(--bg);border:1px solid var(--panel);border-radius:12px;padding:12px;margin-top:10px}
.callout{text-align:center}
.big{font-size:2rem;font-weight:800}
.muted{color:var(--mut)} .tiny{font-size:.7rem} .c{text-align:center}
.empty{text-align:center;padding:28px 0}
.empty-icon{font-size:2.5rem;margin-bottom:10px}
.empty-text{color:var(--mut);font-size:.85rem;margin-bottom:16px;line-height:1.5}
.note{background:var(--panel);border-left:3px solid var(--acc);border-radius:8px;padding:10px 12px;font-size:.76rem;line-height:1.55;color:#cbd5e1;margin-bottom:12px}
.errbox{background:#450a0a;color:#f87171;border-radius:8px;padding:10px 12px;font-size:.78rem;margin:10px 0}
.btn-primary{background:var(--acc);color:#fff;border:none;border-radius:12px;padding:12px;width:100%;font-size:.9rem;font-weight:700;cursor:pointer}
.btn-primary:disabled{background:#374151;cursor:default}
.btn-secondary{background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;font-size:.82rem;font-weight:600;cursor:pointer}
.btn-pill{background:#1e3a5f;color:#60a5fa;border:none;border-radius:9999px;padding:5px 11px;font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-icon{background:var(--line);color:#fff;border:none;border-radius:9999px;width:30px;height:30px;font-size:1rem;font-weight:700;cursor:pointer}
.btn-remove{background:none;border:none;color:#ef4444;cursor:pointer;font-size:.85rem;padding:2px 4px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #60a5fa;outline-offset:2px}
.row2{display:flex;gap:8px;align-items:stretch}.row2>*{flex:1}
.row3{display:flex;gap:6px;flex-wrap:wrap}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.inp{width:100%;background:var(--bg);color:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:.88rem}
.lbl{display:block;font-size:.72rem;color:var(--mut);margin:12px 0 5px}
.check{display:flex;gap:8px;align-items:center;font-size:.8rem;margin-top:12px;color:#cbd5e1}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;background:none;border:none;color:var(--mut);padding:9px 6px;font-size:.78rem;font-weight:600;cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.chip{background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:9999px;padding:6px 12px;font-size:.78rem;cursor:pointer}
.chip.on{background:#7c2d12;color:#fed7aa;border-color:var(--acc)}
.chip.sm{padding:3px 8px;font-size:.68rem;cursor:default}
.pills-wrap{display:flex;flex-wrap:wrap;gap:6px}
.section-label{font-size:.68rem;color:var(--mut);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:4px 0 8px}
.meal-pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.meal-pills::-webkit-scrollbar{display:none}
.meal-pill{background:var(--panel);color:var(--mut);border:none;border-radius:9999px;padding:6px 12px;font-size:.72rem;font-weight:600;cursor:pointer;white-space:nowrap}
.meal-pill.active{background:var(--acc);color:#fff}
.search-input{width:100%;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:.88rem;outline:none;margin-bottom:10px}
.food-list{border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:260px;overflow-y:auto;margin-bottom:10px}
.food-item{width:100%;background:transparent;border:none;border-bottom:1px solid var(--panel);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;cursor:pointer;color:#fff;text-align:left;gap:8px}
.food-item.selected{background:#1e3a5f;color:#60a5fa}
.food-item-right{text-align:right;flex-shrink:0}
.food-item-protein{font-size:.7rem;color:var(--acc)}
.food-item-source{font-size:.62rem;color:#64748b;margin-top:1px}
.search-status{font-size:.74rem;color:var(--mut);padding:10px 14px;text-align:center}
.search-stage{display:inline-block;padding:2px 8px;border-radius:9999px;font-size:.65rem;font-weight:600;margin-bottom:6px}
.stage-off{background:#1e3a5f;color:#60a5fa}.stage-usda{background:#1e3a3f;color:#34d399}.stage-ai{background:#2d1b69;color:#a78bfa}
.macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.macro-box{background:var(--bg);border-radius:8px;padding:8px 4px;text-align:center}
.macro-box-val{font-size:.88rem;font-weight:700}.macro-box-label{font-size:.65rem;color:var(--mut);margin-top:2px}
.servings-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}.servings-val{font-weight:700;min-width:28px;text-align:center}
.meal-card{background:var(--panel);border-radius:12px;padding:12px;margin-bottom:10px}
.meal-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px}
.meal-card-name{font-weight:700;font-size:.9rem}.meal-card-macros{font-size:.7rem;color:var(--mut);text-align:right;line-height:1.4}
.meal-food{display:flex;align-items:center;gap:6px;font-size:.78rem;color:#cbd5e1;padding:5px 0;border-top:1px solid var(--bg)}
.meal-food:first-child{border-top:none}
.meal-food-macros{font-size:.68rem;color:#64748b;white-space:nowrap}
.slot-tag{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);font-weight:700;min-width:58px}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.portions{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.ing{padding-left:18px;font-size:.78rem;line-height:1.6;color:#cbd5e1}
.shop-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bg);font-size:.85rem}
.shop-row:last-child{border-bottom:none}.shop-row input{width:18px;height:18px;accent-color:var(--acc)}
.setrow{display:flex;align-items:center;gap:8px;margin-bottom:6px}.setrow .inp{width:90px}
.person.active{border:1px solid var(--acc)}
.trow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--bg)}
.trow:last-child{border-bottom:none}.row-label{font-size:.85rem;font-weight:600}.row-sub{font-size:.68rem;color:var(--mut)}.row-val{font-size:1rem;font-weight:800;color:var(--acc)}
.fold{margin-top:14px}.fold>summary{cursor:pointer;font-weight:700;font-size:.88rem;padding:12px 14px;background:var(--panel);border-radius:12px;list-style:none}
.fold[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0}.fold>.card{border-top-left-radius:0;border-top-right-radius:0}
.quick-prompts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.quick-btn{background:var(--panel);color:var(--mut);border:1px solid var(--line);border-radius:9999px;padding:6px 11px;font-size:.72rem;cursor:pointer}
.coach-input-row{display:flex;gap:6px;margin-bottom:10px}
.coach-input{flex:1;background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.85rem;outline:none}
.ask-btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:.85rem;font-weight:700;cursor:pointer}
.ask-btn:disabled{background:#374151}
.coach-response-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.coach-label{font-size:.72rem;font-weight:700;color:#4ade80;margin-bottom:8px}
.coach-text{font-size:.84rem;color:#e2e8f0;line-height:1.6;white-space:pre-wrap}
.thinking{text-align:center;padding:14px;background:var(--panel);border-radius:12px;color:var(--mut);font-size:.85rem}
.notif-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bg)}
.notif-label{font-size:.85rem;font-weight:600}
.toggle{position:relative;width:44px;height:24px;flex-shrink:0;display:inline-block}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--line);border-radius:9999px;cursor:pointer;transition:background .2s}
.toggle input:checked+.toggle-track{background:var(--acc)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;pointer-events:none}
.toggle input:checked~.toggle-thumb{transform:translateX(20px)}
.time-input{background:var(--bg);color:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;width:110px;margin-top:4px}
.notif-status{font-size:.72rem;padding:6px 10px;border-radius:8px;font-weight:600}
.notif-status.granted{background:#14532d;color:#4ade80}.notif-status.denied{background:#450a0a;color:#f87171}.notif-status.default{background:var(--bg);color:var(--mut)}
.scan-drop{border:2px dashed var(--line);border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;background:var(--bg);margin-bottom:12px}
.scan-drop-icon{font-size:2.4rem;margin-bottom:8px}.scan-drop-label{font-size:.9rem;font-weight:600;color:var(--acc)}.scan-drop-sub{font-size:.72rem;color:var(--mut);margin-top:4px}
.scan-preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;border:1px solid var(--line);margin-bottom:12px}
.scan-item-card{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:8px;border:1px solid var(--line)}
.scan-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px}
.scan-item-name-input{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.85rem;flex:1;min-width:0}
.scan-macro-input{background:var(--panel);color:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:.78rem;width:100%;text-align:center}
.scan-macro-label{font-size:.6rem;color:var(--mut);text-align:center;margin-top:2px}
.scan-thinking{text-align:center;padding:30px 0}
.tmr-phase{text-align:center;font-weight:800;letter-spacing:.1em;margin-top:6px}.tmr-phase.work{color:#4ade80}.tmr-phase.rest{color:#60a5fa}.tmr-phase.ready{color:#fbbf24}
.tmr-num{text-align:center;font-size:4rem;font-weight:800;line-height:1.1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#0b1220;border:1px solid var(--line);color:#fff;padding:10px 16px;border-radius:9999px;font-size:.82rem;opacity:0;pointer-events:none;transition:all .25s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
a{color:#60a5fa}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-title">⚡ Fueld</div>
        <div class="header-sub">Science-based fuel & training for the whole family</div>
        <div id="profSelWrap"></div>
      </div>
      <div id="headerProtein" style="display:none">
        <div class="header-protein-num" id="headerProteinNum">0g</div>
        <div class="header-protein-label" id="headerProteinLabel">of 0g protein</div>
      </div>
    </div>
    <div id="barsSection" style="display:none" class="bars"></div>
  </div>
  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="view"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>window.FD_APP_NAME="Fueld";</script>
<script src="fd-data.js"></script>
<script src="fd-engine.js"></script>
<script src="fd-app.js"></script>
</body>
</html>
