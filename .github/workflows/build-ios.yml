name: Build iOS

# Every trigger: proves the iOS project compiles (unsigned simulator build, no Apple account needed).
# When the four Apple secrets exist: cloud-signs with your App Store Connect API key (no certificates to export),
# makes Fueld.ipa and - on a version tag, a release, a manual run with "upload" ticked, or IOS_AUTO_UPLOAD=true - sends it to TestFlight.
# The iOS project is GENERATED here with `cap add ios`.
on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths: ['index.html', 'fd-*.js', 'manifest.json', 'icon-*.png', 'apple-touch-icon.png', 'native/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the signed build to TestFlight'
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # Apple has required the Xcode 26 / iOS 26 SDK for uploads since 28 Apr 2026 - macos-26 ships it.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      HAS_APPLE: ${{ secrets.ASC_KEY_P8_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
      WANT_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || github.ref_type == 'tag' || github.event_name == 'release' || vars.IOS_AUTO_UPLOAD == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Engine tests
        run: node --test test/engine.test.mjs

      - name: Show toolchain
        run: xcodebuild -version

      - name: Work out version
        id: ver
        run: |
          PKG=$(node -p "require('./native/package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="$PKG"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Install, build web bundle, generate iOS project
        working-directory: native
        run: |
          npm ci
          npm run build:www
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios

      - name: CocoaPods
        working-directory: native/ios/App
        run: pod install --repo-update

      - name: Camera/photo usage strings + no non-exempt encryption (skips the export-compliance prompt)
        run: |
          PLIST=native/ios/App/App/Info.plist
          pb() { /usr/libexec/PlistBuddy -c "Add :$1 $2 $3" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :$1 $3" "$PLIST"; }
          pb ITSAppUsesNonExemptEncryption bool false
          pb NSCameraUsageDescription string "Fueld uses the camera to photograph meals so it can estimate their nutrition."
          pb NSPhotoLibraryUsageDescription string "Fueld lets you choose meal photos to estimate their nutrition."

      # Unsigned build: proves the project compiles. Runs on every trigger.
      - name: Build (unsigned, simulator)
        working-directory: native/ios/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -50

      - name: Sign, archive and export Fueld.ipa
        if: env.HAS_APPLE == 'true'
        working-directory: native/ios/App
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -o pipefail
          mkdir -p ~/.private_keys "$GITHUB_WORKSPACE/out"
          echo "$P8" | base64 --decode > ~/.private_keys/AuthKey_${KEY_ID}.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/.private_keys/AuthKey_${KEY_ID}.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PL
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fueld.xcarchive" $AUTH DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER MARKETING_VERSION=$VERSION_NAME archive | tail -30
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Fueld.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" $AUTH | tail -15
          cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/out/Fueld.ipa"

      - name: Upload to TestFlight
        if: env.HAS_APPLE == 'true' && env.WANT_UPLOAD == 'true'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: xcrun altool --upload-app -f out/Fueld.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"

      - uses: actions/upload-artifact@v4
        if: env.HAS_APPLE == 'true'
        with:
          name: Fueld-ios
          path: out/Fueld.ipa
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release' && env.HAS_APPLE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: out/Fueld.ipa
